version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodegoat-app
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/nodegoat
      - DB_USER=admin
      - DB_PASSWORD=admin_password
    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - nodegoat-network
    volumes:
      - ./app:/app/app
      - ./views:/app/views
    restart: unless-stopped
  
  mongo:
    image: mongo:4.4
    container_name: nodegoat-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_password
      - MONGO_INITDB_DATABASE=nodegoat
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - nodegoat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  nodegoat-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
